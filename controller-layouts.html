    .tabs {
      display: flex;
      flex-wrap: wrap;

      margin: 22px 0 14px;
    }
    .tabs button, .modes button, .plat button {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      cursor: pointer;
    }
    .tabs button[aria-selected="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fffaf3;
    }
    .sheet {

      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(60, 40, 20, .08);
      overflow: hidden;

    .sheet-head {

      gap: 16px;
      flex-wrap: wrap;
      align-items: flex-end;
      padding: 18px 18px 0;

      color: #f7f1e6;
      border-color: var(--ink);

    .search {
      margin-left: auto;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      min-width: min(240px, 100%);
      color: var(--ink);
    }

    .diagram {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(260px, 340px) minmax(180px, 1fr);

      padding: 16px 18px 8px;
      align-items: center;
    }
    .calls { display: flex; flex-direction: column; gap: 6px; }

      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: start;
      background: var(--chip);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 7px 10px;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
      width: 100%;
    }
    .chip small { display: block; color: var(--muted); font-size: 12px; }
    .chip strong { font-weight: 650; font-size: 14px; }
    .chip .glyph {
      min-width: 2.4em;
      text-align: center;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.2;
    }
    .chip.idle { opacity: .38; }
    .chip.hot, .chip:hover { border-color: var(--accent); background: var(--accent-soft); }

    .pad-wrap { position: relative; }
    svg.pad { width: 100%; height: auto; display: block; }
    .pad-btn { fill: var(--unused); stroke: #1a1713; stroke-width: 1.5; }
    .pad-btn.used { fill: var(--accent); }
    .pad-btn.on { stroke: #fff6e8; stroke-width: 3; }
    .glyph-text { font: 700 11px "Segoe UI", "PingFang SC", sans-serif; fill: #f6f0e6; text-anchor: middle; pointer-events: none; }
    #pad-l3, #pad-r3 { fill: #14120f; }
    #pad-l3.used, #pad-r3.used { fill: #fff6e8; }
    #pad-l3.on, #pad-r3.on { stroke: #fff6e8; }
    .body-shape { fill: var(--pad); stroke: var(--pad-line); stroke-width: 2; }
    .hint { text-align: center; color: var(--muted); font-size: 12px; margin: 0 0 8px; }

    .list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      padding: 8px 18px 18px;
    }
    .group {
      border-top: 2px solid var(--accent);
      background: var(--paper);
      border-radius: 0 0 12px 12px;
      padding: 10px 12px 12px;
    }
    .group h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
    .row {
      display: grid;
      grid-template-columns: minmax(7.5rem, max-content) 1fr;
      gap: 8px;
      padding: 6px 0;
      border-top: 1px solid var(--line);
      font-size: 14px;
    }
    .row:first-of-type { border-top: 0; }
    .row b { color: var(--accent); font-weight: 750; }

    .notes, .sources { padding: 0 18px 18px; }
    .notes h3, .sources h3 { margin: 0 0 8px; font-size: 15px; }
    .notes ul, .sources ul { margin: 0; padding-left: 1.2em; }
    .notes li + li, .sources li + li { margin-top: 6px; }
    .sources a { color: var(--accent); }
    footer.colophon {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 860px) {
      .diagram { grid-template-columns: 1fr; }
      .pad-wrap { order: -1; max-width: 420px; margin: 0 auto; }
      .search { margin-left: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>

    const state = { game: "tsushima", mode: "field", plat: "ps", q: "", pin: null };

    const $ = (id) => document.getElementById(id);

    function game() { return GAMES.find((g) => g.id === state.game); }
    function mode() {
      const g = game();
      return g.modes.find((m) => m.id === state.mode) || g.modes[0];
    }
    function label(key) { return KEYS[key][state.plat]; }
    function glyph(key) { return GLYPH[key][state.plat]; }
    function keyText(action) {
      const parts = action.keys.map(label);
      return action.chord ? parts.join(" + ") : parts.join(" / ");
    }
    function visibleActions() {
      const q = state.q.trim().toLowerCase();
      return mode().actions.filter((a) => !q || a.name.toLowerCase().includes(q) || keyText(a).toLowerCase().includes(q));
    }
    function category(action) {
      if (action.chord) return "chord";
      return KEY_GROUP[action.keys[0]];
    }

    function applyTheme() {
      const g = game();
      document.documentElement.style.setProperty("--accent", g.accent);
      document.documentElement.style.setProperty("--accent-soft", g.soft);
    }

    function syncHash() {
      const next = "#" + state.game + "/" + state.mode + "/" + state.plat;
      if (location.hash !== next) history.replaceState(null, "", next);
    }

    function readHash() {
      const [g, m, p] = location.hash.replace("#", "").split("/");
      if (GAMES.some((x) => x.id === g)) state.game = g;
      const found = game().modes.find((x) => x.id === m);
      state.mode = found ? found.id : game().modes[0].id;
      if (p === "ps" || p === "xb") state.plat = p;
    }

    function actionsFor(key) {
      return visibleActions().filter((a) => a.keys.includes(key));
    }

    function renderTabs() {
      $("tabs").replaceChildren(...GAMES.map((g) => {
        const b = document.createElement("button");
        b.type = "button";
        b.role = "tab";
        b.textContent = g.name;
        b.setAttribute("aria-selected", String(g.id === state.game));
        b.onclick = () => {
          state.game = g.id;
          state.mode = g.modes[0].id;
          state.pin = null;
          render();
        };
        return b;
      }));
    }

    function renderModes() {
      $("modes").replaceChildren(...game().modes.map((m) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = m.name;
        b.setAttribute("aria-pressed", String(m.id === mode().id));
        b.onclick = () => { state.mode = m.id; state.pin = null; render(); };
        return b;
      }));
    }

    function renderPlat() {
      $("plat").replaceChildren(...[
        ["ps", "PlayStation"],
        ["xb", "Xbox"]
      ].map(([id, name]) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = name;
        b.setAttribute("aria-pressed", String(state.plat === id));
        b.onclick = () => { state.plat = id; render(); };
        return b;
      }));
    }

    function renderGlyphs() {
      for (const key of Object.keys(KEYS)) {
        const node = $("glyph-" + key);
        if (node) node.textContent = glyph(key);
      }
      const used = new Set(visibleActions().flatMap((a) => a.keys));
      const hot = new Set(state.pin ? state.pin.split(",") : []);
      for (const key of Object.keys(KEYS)) {
        const node = $("pad-" + key);
        if (!node) continue;
        node.classList.toggle("used", used.has(key));
        node.classList.toggle("on", hot.has(key));
      }
      $("pad-hint").textContent = state.plat === "ps"
        ? "中央宽键是触摸板，小圆键是 Options。L3 / R3 是按下摇杆。"
        : "中央宽键对应 View，小圆键对应 Menu。LS / RS 是按下摇杆。面键按 Xbox 位置：下 A、右 B、左 X、上 Y。";
    }

    function makeChip(key) {
      const acts = actionsFor(key);
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "chip" + (acts.length ? "" : " idle");
      const pin = state.pin === key;
      if (pin) btn.classList.add("hot");
      const glyph = document.createElement("span");
      glyph.className = "glyph";
      glyph.textContent = label(key);
      const text = document.createElement("span");
      const strong = document.createElement("strong");
      strong.textContent = acts.length ? acts.map((a) => a.name).join("；") : "此情境未使用";
      text.append(strong);
      btn.append(glyph, text);
      btn.onmouseenter = () => { if (!state.pin) setHot(key); };
      btn.onmouseleave = () => { if (!state.pin) setHot(null); };
      btn.onclick = () => {
        state.pin = state.pin === key ? null : key;
        render();
      };
      return btn;
    }

    function setHot(key) {
      for (const id of Object.keys(KEYS)) {
        $("pad-" + id).classList.toggle("on", key === id);
      }
    }

    function renderCalls() {
      $("calls-left").replaceChildren(...LEFT.map(makeChip));
      $("calls-right").replaceChildren(...RIGHT.map(makeChip));
    }

    function renderList() {
      const buckets = new Map();
      for (const action of visibleActions()) {
        const cat = category(action);
        if (!buckets.has(cat)) buckets.set(cat, []);
        buckets.get(cat).push(action);
      }
      const order = ["stick", "shoulder", "face", "dpad", "system", "chord"];
      const blocks = [];
      for (const cat of order) {
        const items = buckets.get(cat);
        if (!items) continue;
        const section = document.createElement("section");
        section.className = "group";
        const h = document.createElement("h3");
        h.textContent = GROUP[cat];
        section.append(h);
        for (const action of items) {
          const row = document.createElement("div");
          row.className = "row";
          const b = document.createElement("b");
          b.textContent = keyText(action);
          const span = document.createElement("span");
          span.textContent = action.name;
          row.append(b, span);
          section.append(row);
        }
        blocks.push(section);
      }
      if (!blocks.length) {
        const empty = document.createElement("p");
        empty.textContent = "没有符合筛选的功能。";
        $("list").replaceChildren(empty);
        return;
      }
      $("list").replaceChildren(...blocks);
    }

    function renderNotes() {
      $("title").textContent = game().name;
      $("en").textContent = game().en;
      $("summary").textContent = game().summary;
      $("notes").replaceChildren(...game().notes.map((text) => {
        const li = document.createElement("li");
        li.textContent = text;
        return li;
      }));
      $("sources").replaceChildren(...game().sources.map(([name, url]) => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = name;
        li.append(a);
        return li;
      }));
    }

    function render() {
      if (!game().modes.some((m) => m.id === state.mode)) state.mode = game().modes[0].id;
      applyTheme();
      renderTabs();
      renderModes();
      renderPlat();
      renderNotes();
      renderGlyphs();
      renderCalls();
      renderList();
      syncHash();
      document.title = game().name + " · 手柄键位图";
    }

    $("search").addEventListener("input", (e) => {
      state.q = e.target.value;
      renderGlyphs();
      renderCalls();
      renderList();
    });

    window.addEventListener("hashchange", () => { readHash(); render(); });
    readHash();
    render();
  </script>
